name: Build & Publish KMP (Android + iOS)
on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
      - "**.html"
  workflow_dispatch:
env:
  APP_NAME: "kocicky"
  BUNDLE_ID: "cz.mares.kocicky"
  APP_VERSION: "1.1"
  PUBLISH_TO_STORES: "true"
  BUILD_IOS: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=3000"
jobs:
  build-android:
    name: Android Release (.apk & .aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Detect Package Name and Prepare Build Number
        run: |
          BUILD_NUM=$(( ${GITHUB_RUN_NUMBER:-1} + 100 ))
          echo "PROJECT_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          if [ -f "composeApp/build.gradle.kts" ]; then
            DETECTED_PKG=$(sed -n 's/.*applicationId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -n 1 | tr -d '\r\n ')
            if [ -n "$DETECTED_PKG" ]; then
              echo "BUNDLE_ID=${DETECTED_PKG}" >> $GITHUB_ENV
            fi
          fi
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p /tmp/gw_init
            echo 'rootProject.name = "init"' > /tmp/gw_init/settings.gradle.kts
            cd /tmp/gw_init && gradle wrapper --gradle-version 8.7 --no-daemon && cd - > /dev/null
            cp -f /tmp/gw_init/gradlew . && cp -rf /tmp/gw_init/gradle .
          fi
          chmod +x gradlew
      - name: Fetch Signing Keys from Private Vault (ios-keys)
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p iosApp/signing
          if [ -n "$VAULT_TOKEN" ]; then
            if curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${OWNER}/ios-keys/contents/android_keystore_${APP_NAME}.b64" -o "iosApp/signing/android_keystore.b64" && \
              curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${OWNER}/ios-keys/contents/android_keystore_${APP_NAME}.props" -o "iosApp/signing/android_keystore.props"; then
              echo "✅ Nacten vlastni Android keystore pro projekt ${APP_NAME}."
            else
              for f in android_keystore.b64 android_keystore.props; do
                curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
                  "https://api.github.com/repos/${OWNER}/ios-keys/contents/${f}" -o "iosApp/signing/${f}" || rm -f "iosApp/signing/${f}"
              done
              echo "✅ Nacten vychozi Android keystore z ios-keys."
            fi
            curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${OWNER}/ios-keys/contents/gplaykey.json.b64" -o "iosApp/signing/gplaykey.json.b64" || rm -f "iosApp/signing/gplaykey.json.b64"
            for hf in huawei_key.json.b64 huaweikey.json.b64 agconnect_key.json.b64; do
              if curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/${OWNER}/ios-keys/contents/${hf}" -o "iosApp/signing/huawei_key.json.b64"; then break; fi
            done
          fi
      - name: Prepare Android Signing Keystore
        run: |
          if [ -s "iosApp/signing/android_keystore.b64" ] && [ -s "iosApp/signing/android_keystore.props" ]; then
            base64 --decode < iosApp/signing/android_keystore.b64 > /tmp/android_keystore.jks
            echo "CM_KEYSTORE_PATH=/tmp/android_keystore.jks" >> $GITHUB_ENV
            while IFS='=' read -r key val; do
              key=$(echo "$key" | tr -d '\r\n ')
              val=$(echo "$val" | tr -d '\r\n')
              if [ -n "$key" ]; then export "${key}=${val}"; echo "${key}=${val}" >> $GITHUB_ENV; fi
            done < iosApp/signing/android_keystore.props
            DETECTED_ALIAS=$(keytool -J-Duser.language=en -list -v -keystore /tmp/android_keystore.jks -storepass "$CM_KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -n 1 | tr -d '\r\n ')
            if [ -n "$DETECTED_ALIAS" ]; then echo "CM_KEY_ALIAS=$DETECTED_ALIAS" >> $GITHUB_ENV; fi
          fi
      - name: Build Android Release AAB and APK
        run: |
          if [ -f "composeApp/build.gradle.kts" ]; then
            sed -i "s/versionName = \"[0-9.]*\\.\$ciBuildNumber\"/versionName = \"${APP_VERSION}.\$ciBuildNumber\"/g" composeApp/build.gradle.kts || true
            sed -i "s/versionName = \"[0-9.]*\\.\\\${ciBuildNumber}\"/versionName = \"${APP_VERSION}.\\\${ciBuildNumber}\"/g" composeApp/build.gradle.kts || true
          fi
          for gw_try in 1 2 3; do
            ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease --no-daemon && break
            if [ "$gw_try" -eq 3 ]; then exit 1; fi
            echo "⚠️ Vypadek site (dl.google.com), opakuji Android build ($gw_try/3) za 15 s..."
            sleep 15
          done
          VERSION_NAME="${APP_VERSION}.${PROJECT_BUILD_NUMBER}"
          mv composeApp/build/outputs/apk/release/composeApp-release.apk "composeApp/build/outputs/apk/release/${APP_NAME}-${VERSION_NAME}.apk"
          mv composeApp/build/outputs/bundle/release/composeApp-release.aab "composeApp/build/outputs/bundle/release/${APP_NAME}-${VERSION_NAME}.aab"
      - name: Upload Android Artifacts (.apk & .aab)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Android-APK-AAB
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
      - name: Publish Android AAB to Google Play (Internal Testing)
        run: |
          if [ "$PUBLISH_TO_STORES" != "true" ]; then
            echo "ℹ️ Publikace do obchodu je vypnuta. Preskakuji Google Play."
          elif [ -s "iosApp/signing/gplaykey.json.b64" ]; then
            base64 --decode < iosApp/signing/gplaykey.json.b64 > /tmp/gplay_key.json
            pip3 install --quiet --break-system-packages google-api-python-client google-auth-httplib2 google-auth-oauthlib || pip3 install --quiet google-api-python-client google-auth-httplib2 google-auth-oauthlib
            python3 - << 'EOF'
          import os, time, socket
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError
          socket.setdefaulttimeout(300)
          package_name = os.environ.get("BUNDLE_ID")
          build_num = os.environ.get("PROJECT_BUILD_NUMBER", "101")
          app_name = os.environ.get("APP_NAME")
          app_version = os.environ.get("APP_VERSION", "1.0")
          aab_path = f"composeApp/build/outputs/bundle/release/{app_name}-{app_version}.{build_num}.aab"
          def upload_to_gplay():
              creds = service_account.Credentials.from_service_account_file("/tmp/gplay_key.json", scopes=["https://www.googleapis.com/auth/androidpublisher"])
              service = build("androidpublisher", "v3", credentials=creds, cache_discovery=False)
              edit_id = service.edits().insert(body={}, packageName=package_name).execute(num_retries=5)["id"]
              media = MediaFileUpload(aab_path, mimetype="application/octet-stream", resumable=True)
              version_code = service.edits().bundles().upload(editId=edit_id, packageName=package_name, media_body=media).execute(num_retries=5)["versionCode"]
              def commit_edit(eid, is_draft=False):
                  try:
                      service.edits().commit(editId=eid, packageName=package_name).execute(num_retries=5)
                      print(f"✅ VYSLEDEK GOOGLE PLAY: .aab ({app_version}.{build_num}) ulozen (draft={is_draft})!")
                  except Exception as cerr:
                      if "Only releases with status draft" in str(cerr): raise cerr
                      service.edits().commit(editId=eid, packageName=package_name, changesNotSentForReview=True).execute(num_retries=5)
                      print(f"✅ VYSLEDEK GOOGLE PLAY: .aab ({app_version}.{build_num}) ulozen (changesNotSentForReview=True)!")
              try:
                  service.edits().tracks().update(editId=edit_id, track="internal", packageName=package_name, body={"releases": [{"versionCodes": [str(version_code)], "status": "completed"}]}).execute(num_retries=5)
                  commit_edit(edit_id, is_draft=False)
              except Exception:
                  service.edits().tracks().update(editId=edit_id, track="internal", packageName=package_name, body={"releases": [{"versionCodes": [str(version_code)], "status": "draft"}]}).execute(num_retries=5)
                  commit_edit(edit_id, is_draft=True)
          for attempt in range(1, 4):
              try:
                  upload_to_gplay()
                  break
              except HttpError as e:
                  if e.resp.status == 404:
                      print(f"⚠️ GOOGLE PLAY: Balicek '{package_name}' zatim v Google Play neexistuje (404).")
                      break
                  elif "already been used" in str(e) or "version code" in str(e).lower():
                      print(f"✅ GOOGLE PLAY: Verze {build_num} uz je nahrana.")
                      break
                  elif attempt < 3: time.sleep(10)
              except Exception as e:
                  if attempt < 3: time.sleep(15)
                  else: print(f"⚠️ GOOGLE PLAY: Nepodarilo se dokoncit zapis: {e}")
          EOF
          fi
      - name: Publish Android APK to Huawei AppGallery
        run: |
          if [ "$PUBLISH_TO_STORES" != "true" ]; then
            echo "ℹ️ Publikace do obchodu je vypnuta. Preskakuji Huawei AppGallery."
          elif [ -s "iosApp/signing/huawei_key.json.b64" ]; then
            base64 --decode < iosApp/signing/huawei_key.json.b64 > /tmp/huawei_key.json
            pip3 install --quiet --break-system-packages pyjwt cryptography requests || pip3 install --quiet pyjwt cryptography requests
            python3 - << 'EOF'
          import os, sys, json, time, jwt, requests
          package_name = os.environ.get("BUNDLE_ID", "").strip()
          build_num = os.environ.get("PROJECT_BUILD_NUMBER", "101").strip()
          app_name = os.environ.get("APP_NAME", "").strip()
          app_version = os.environ.get("APP_VERSION", "1.0").strip()
          apk_path = f"composeApp/build/outputs/apk/release/{app_name}-{app_version}.{build_num}.apk"
          KNOWN_APP_IDS = {"cz.taximares.radiopm": "119618129", "cz.mares.radiopm": "119618129"}
          if not os.path.exists(apk_path): sys.exit(0)
          try:
              hk = json.load(open("/tmp/huawei_key.json", "r", encoding="utf-8"))
              key_id, priv_key, sub_account = str(hk.get("key_id", "")).strip(), str(hk.get("private_key", "")).strip(), str(hk.get("sub_account", "")).strip()
              token_uri = str(hk.get("token_uri", "https://connect-api.cloud.huawei.com/api/oauth2/v1/token")).strip()
              base_agc = "https://connect-api.cloud.huawei.com/api"
              now, candidates = int(time.time()), []
              if sub_account and priv_key:
                  for alg in ["PS256", "RS256"]:
                      for aud_val in [token_uri, "https://oauth-login.cloud.huawei.com/oauth2/v3/token", "https://connect-api.cloud.huawei.com/api/oauth2/v1/token", "https://connect-api.cloud.huawei.com"]:
                          try:
                              tok = jwt.encode({"iss": sub_account, "aud": aud_val, "iat": now - 30, "exp": now + 3000}, priv_key, algorithm=alg, headers={"kid": key_id, "typ": "JWT", "alg": alg})
                              if isinstance(tok, bytes): tok = tok.decode("utf-8")
                              candidates.append((f"JWT-{alg}", {"Authorization": f"Bearer {tok}", "client_id": sub_account, "Content-Type": "application/json"}))
                          except Exception: pass
              if "client_secret" in hk or "key" in hk:
                  c_sec, c_id = hk.get("client_secret") or hk.get("key"), hk.get("client_id") or sub_account
                  tr = requests.post(f"{base_agc}/oauth2/v1/token", json={"grant_type": "client_credentials", "client_id": c_id, "client_secret": c_sec}, timeout=30)
                  if tr.ok and tr.json().get("access_token"):
                      candidates.insert(0, ("OAuth", {"Authorization": f"Bearer {tr.json()['access_token']}", "client_id": str(c_id), "Content-Type": "application/json"}))
              working_headers, app_res, known_id = None, None, KNOWN_APP_IDS.get(package_name, "")
              for label, hdrs in candidates:
                  test_r = requests.get(f"{base_agc}/publish/v2/appid-list", params={"packageName": package_name}, headers=hdrs, timeout=30)
                  if test_r.ok: working_headers, app_res = hdrs, test_r; break
                  elif known_id:
                      test_r2 = requests.get(f"{base_agc}/publish/v2/app-info", params={"appId": known_id}, headers=hdrs, timeout=30)
                      if test_r2.ok: working_headers, app_res = hdrs, test_r2; break
              if not working_headers: sys.exit(0)
              huawei_app_id = ""
              if app_res and app_res.ok and app_res.json().get("appids"):
                  huawei_app_id = str(app_res.json()["appids"][0].get("value", ""))
              if not huawei_app_id: huawei_app_id = known_id
              if not huawei_app_id: sys.exit(0)
              url_res = requests.get(f"{base_agc}/publish/v2/upload-url/for-obs", params={"appId": huawei_app_id, "fileName": os.path.basename(apk_path), "contentLength": os.path.getsize(apk_path)}, headers=working_headers, timeout=30)
              if url_res.ok and url_res.json().get("urlInfo"):
                  ui = url_res.json()["urlInfo"]
                  with open(apk_path, "rb") as apk_f:
                      up_r = requests.put(ui.get("url"), data=apk_f, headers=dict(ui.get("headers", {})), timeout=300)
                  if up_r.ok:
                      fi_r = requests.put(f"{base_agc}/publish/v2/app-file-info", params={"appId": huawei_app_id}, json={"fileType": 5, "files": [{"fileName": os.path.basename(apk_path), "fileDestUrl": ui.get("objectId", "")}]}, headers=working_headers, timeout=60)
                      print(f"✅ HUAWEI APPGALLERY: Stav prirazeni APK ({fi_r.status_code}): {fi_r.text[:160]}")
              else:
                  u2 = requests.get(f"{base_agc}/publish/v2/upload-url", params={"appId": huawei_app_id, "suffix": "apk"}, headers=working_headers, timeout=30)
                  if u2.ok and u2.json().get("uploadUrl"):
                      u2d = u2.json()
                      with open(apk_path, "rb") as apk_f:
                          up2 = requests.post(u2d["uploadUrl"], files={"file": (os.path.basename(apk_path), apk_f, "application/octet-stream")}, data={"authCode": u2d.get("authCode", ""), "fileCount": "1"}, timeout=300)
                      if up2.ok:
                          flist = up2.json().get("result", {}).get("UploadFileRsp", {}).get("fileInfoList", [])
                          if flist:
                              durl = flist[0].get("fileDestUlr") or flist[0].get("fileDestUrl")
                              requests.put(f"{base_agc}/publish/v2/app-file-info", params={"appId": huawei_app_id}, json={"fileType": 5, "files": [{"fileName": os.path.basename(apk_path), "fileDestUrl": durl}]}, headers=working_headers, timeout=60)
          except Exception as e:
              print(f"⚠️ HUAWEI APPGALLERY: {e}")
          EOF
          fi
  build-ios:
    name: iOS Release (.ipa & TestFlight)
    runs-on: macos-latest
    if: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Fetch Signing Keys from Private Vault (ios-keys)
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p iosApp/signing
          if [ -n "$VAULT_TOKEN" ]; then
            for f in ioskey.p12.b64 ioskey.pwd apple_api_key.p8.b64 apple_api_key.props; do
              curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/${OWNER}/ios-keys/contents/${f}" -o "iosApp/signing/${f}" || rm -f "iosApp/signing/${f}"
            done
          fi
      - name: Build KMP iOS Framework, Convert Icons, Sign and Publish IPA
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          if [ "$BUILD_IOS" != "true" ]; then exit 0; fi
          export PATH="$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.12/bin:$HOME/Library/Python/3.13/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          BUILD_NUM=$(( ${GITHUB_RUN_NUMBER:-1} + 100 ))
          export PROJECT_BUILD_NUMBER="${BUILD_NUM}"
          if [ -f "composeApp/build.gradle.kts" ]; then
            DETECTED_PKG=$(sed -n 's/.*applicationId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -n 1 | tr -d '\r\n ')
            if [ -n "$DETECTED_PKG" ]; then export BUNDLE_ID="$DETECTED_PKG"; echo "BUNDLE_ID=${DETECTED_PKG}" >> $GITHUB_ENV; fi
          fi
          INITIAL_APP_VERSION="$APP_VERSION"
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p /tmp/gw_init
            echo 'rootProject.name = "init"' > /tmp/gw_init/settings.gradle.kts
            cd /tmp/gw_init && gradle wrapper --gradle-version 8.7 --no-daemon && cd - > /dev/null
            cp -f /tmp/gw_init/gradlew . && cp -rf /tmp/gw_init/gradle .
          fi
          chmod +x gradlew
          for gw_try in 1 2 3; do
            ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon && break
            if [ "$gw_try" -eq 3 ]; then exit 1; fi
            echo "⚠️ Vypadek site (dl.google.com), opakuji iOS build ($gw_try/3) za 15 s..."
            sleep 15
          done
          if ! command -v xcodegen &> /dev/null; then HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen; fi
          pip3 install --quiet --break-system-packages Pillow resvg-py || pip3 install --quiet Pillow resvg-py || pip3 install --quiet --break-system-packages Pillow || pip3 install --quiet Pillow
          python3 - << 'PYEOF'
          import os, io, re, math, glob, json, shutil, subprocess
          import xml.etree.ElementTree as ET
          from PIL import Image, ImageDraw, ImageFont
          O, C = chr(60), chr(62)
          assets_dir = "iosApp/iosApp/Assets.xcassets"
          icon_dir = os.path.join(assets_dir, "AppIcon.appiconset")
          os.makedirs(icon_dir, exist_ok=True)
          with open(os.path.join(assets_dir, "Contents.json"), "w") as f:
              json.dump({"info": {"version": 1, "author": "xcode"}}, f, indent=2)
          def is_detailed_icon(pil_img):
              rgb = pil_img.convert("RGB").resize((1024, 1024), Image.Resampling.LANCZOS)
              ext = rgb.crop((260, 260, 764, 764)).getextrema()
              return sum((hi - lo) for (lo, hi) in ext) >= 18
          def flatten_icon(pil_img, bg_rgb=(15, 23, 42)):
              rgba = pil_img.convert("RGBA").resize((1024, 1024), Image.Resampling.LANCZOS)
              bg = Image.new("RGBA", (1024, 1024), bg_rgb + (255,))
              return Image.alpha_composite(bg, rgba).convert("RGB")
          ANDR_NS = "{http://schemas.android.com/apk/res/android}"
          res_roots = [d for d in ["composeApp/src/androidMain/res", "app/src/main/res"] if os.path.isdir(d)]
          color_map = {}
          for rroot in res_roots:
              for vxml in glob.glob(os.path.join(rroot, "values*", "*.xml")):
                  try:
                      for cel in ET.parse(vxml).getroot().findall(".//color"):
                          if cel.attrib.get("name") and cel.text:
                              color_map[cel.attrib["name"].strip()] = cel.text.strip()
                  except Exception: pass
          def ltag(el): return el.tag.split("}", 1)[-1] if "}" in el.tag else el.tag
          def ga(el, name, default=None):
              for k in (ANDR_NS + name, "android:" + name, name):
                  if k in el.attrib: return el.attrib[k]
              return default
          def pnum(val, default=0.0):
              if val is None: return default
              m = re.match(r"^\s*([+-]?(?:\d+\.?\d*|\.\d+))", str(val))
              return float(m.group(1)) if m else default
          def parse_col(raw, depth=0):
              if not raw or depth > 6: return ("none", 0.0)
              s = str(raw).strip()
              if s.startswith("@color/"):
                  cname = s.split("/", 1)[1]
                  return parse_col(color_map[cname], depth + 1) if cname in color_map else ("#0F172A", 1.0)
              if s == "@android:color/white": return ("#FFFFFF", 1.0)
              if s == "@android:color/black": return ("#000000", 1.0)
              if s == "@android:color/transparent": return ("none", 0.0)
              if s.startswith("#"):
                  h = s[1:]
                  if len(h) == 3: return (f"#{h[0]*2}{h[1]*2}{h[2]*2}", 1.0)
                  if len(h) == 4:
                      a = int(h[0], 16) / 15.0
                      return ("none", 0.0) if a == 0 else (f"#{h[1]*2}{h[2]*2}{h[3]*2}", a)
                  if len(h) == 6: return (f"#{h}", 1.0)
                  if len(h) == 8:
                      a = int(h[0:2], 16) / 255.0
                      return ("none", 0.0) if a == 0 else (f"#{h[2:8]}", a)
              return ("none", 0.0)
          def resolve_drawable(ref):
              if not ref: return None
              s = str(ref).strip()
              if s.startswith(("@color/", "#", "@android:color/")): return ("color", s)
              kind, name = s.lstrip("@").split("/", 1) if "/" in s else ("drawable", s)
              subdirs = [f"{kind}-xxxhdpi", f"{kind}-xxhdpi", f"{kind}-xhdpi", f"{kind}-anydpi-v26", kind, "drawable-xxxhdpi", "drawable-anydpi-v26", "drawable", "mipmap-xxxhdpi", "mipmap-anydpi-v26", "mipmap"]
              for rroot in res_roots:
                  for sd in subdirs:
                      for ext in (".xml", ".png", ".webp", ".jpg", ".jpeg"):
                          cand = os.path.join(rroot, sd, name + ext)
                          if os.path.isfile(cand): return ("xml" if ext == ".xml" else "raster", cand)
              return None
          def next_id(prefix, state):
              state[0] += 1
              return f"{prefix}_{state[0]}"
          def grad_to_def(gel, state, shape_box=108.0, is_shape=False):
              gid = next_id("grad", state)
              gtype = (ga(gel, "type", "linear") or "linear").lower()
              stops = []
              for item in gel:
                  if ltag(item) == "item":
