                              if ir.ok:
                                  for it in ir.json().get("data", []):
                                      requests.delete(f"{base_url}/reviewSubmissionItems/{it['id']}", headers=get_headers(), timeout=30)
                              requests.patch(f"{base_url}/reviewSubmissions/{sid}", json={"data": {"type": "reviewSubmissions", "id": sid, "attributes": {"canceled": True}}}, headers=get_headers(), timeout=30)
              cleanup_draft_submissions()
              ver_res = requests.get(f"{base_url}/apps/{app_id}/appStoreVersions", params={"filter[platform]": "IOS"}, headers=get_headers(), timeout=30)
